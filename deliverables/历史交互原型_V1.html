<body><a class="skip-link" href="#main">跳到主要内容</a><div class="shell">
<aside class="sidebar"><a class="brand" href="#overview">AI数字员工<br>协作工作台</a><div class="workspace-label">工作空间</div><div class="workspace-name">慕雅居电商团队<small>演示工作空间</small></div><button class="sidebar-create" data-new>＋ 新建目标 <span>↗</span></button>
<nav aria-label="主要导航"><button class="nav-item" data-view="overview"><span data-icon="grid"></span>协同工作台</button><button class="nav-item" data-view="tasks"><span data-icon="layers"></span>任务中心 <b id="nav-count">0</b></button><button class="nav-item" data-view="agents"><span data-icon="users"></span>数字员工</button><button class="nav-item" data-view="artifacts"><span data-icon="file"></span>交付物</button><button class="nav-item" data-view="connections"><span data-icon="link"></span>连接与设置</button></nav><div class="sidebar-bottom"><span class="avatar">你</span><div>工作空间管理员<small>目标负责人</small></div></div></aside>
<div class="main-shell"><header class="topbar"><span>工作空间 <i>/</i> <strong id="page-crumb">协同工作台</strong></span><div><span class="badge">演示模式</span><span id="connection-state">正在连接</span></div></header><main id="main" tabindex="-1"></main><footer>演示资料与模拟操作 · 尚未连接真实店铺和大模型</footer></div></div>
<dialog id="task-dialog" aria-labelledby="new-title"><form id="task-form"><div class="dialog-head"><div><span class="eyebrow" id="new-step">新建目标 · 1 / 2</span><h2 id="new-title">交给数字员工一个目标</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="关闭新建目标">×</button></div>
<section id="create-step-one"><label for="goal">你想完成什么？</label><textarea id="goal" required maxlength="2000" rows="3" placeholder="例如：为角阀准备上新资料，确认后发布，并观察一周经营表现。"></textarea><label for="goal-kind">选择协作模板</label><select id="goal-kind"><option value="analysis">经营分析 · 准备建议，不执行发布</option><option value="listing">商品上新 · 资料、草案、审批与复盘</option></select><p class="field-hint">模板用于演示任务路径；真实目标理解与动态拆解待接入。</p><fieldset><legend>邀请参与的 Agent</legend><div id="agent-options"></div></fieldset></section>
<section id="create-step-two" hidden><div class="scope-preview" id="scope-preview"></div><label for="goal-permission">执行边界</label><select id="goal-permission"><option value="approval">发布前逐次审批（演示）</option><option value="draft">只准备草案，不进入发布流程</option></select><p class="field-hint" id="scope-note"></p></section>
<p id="form-error" role="alert"></p><div class="dialog-footer"><button type="button" class="text-button" id="create-back" hidden>← 返回修改</button><span id="create-hint">一次性目标 · 可随时参与讨论</span><button class="primary" type="submit" id="submit-task">下一步：确认范围 →</button></div></form></dialog>
<dialog id="artifact-dialog" aria-labelledby="artifact-title"><div class="dialog-head"><div><span class="eyebrow">交付物</span><h2 id="artifact-title"></h2></div><button class="icon-btn" id="close-artifact" aria-label="关闭交付物预览">×</button></div><p id="artifact-meta" class="field-hint"></p><pre id="artifact-body"></pre><p id="artifact-evidence"></p><div class="dialog-footer"><span>资料来源随文件一起导出</span><button class="primary" id="download-preview">下载 Markdown ↓</button></div></dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">调整发布内容</h2><button class="icon-btn" type="button" id="close-edit" aria-label="关闭内容调整">×</button></div><p class="field-hint">确认后生成新版本，现有审批失效，需要重新确认计划与草案。</p><label for="publish-title">发布标题</label><input id="publish-title" required maxlength="120"><label for="publish-price">售价（元）</label><input id="publish-price" type="number" min="0.01" max="100000" step="0.01" required><p id="edit-error" role="alert"></p><div class="dialog-footer"><span>仅影响当前目标</span><button class="primary" type="submit">确认变更并重新计划</button></div></form></dialog>
<dialog id="reject-dialog" aria-labelledby="reject-title"><form id="reject-form"><div class="dialog-head"><h2 id="reject-title">退回本次审批</h2><button type="button" class="icon-btn" id="close-reject" aria-label="关闭退回审批">×</button></div><label for="reject-reason">需要修改什么？</label><textarea id="reject-reason" required maxlength="1000" rows="3"></textarea><p id="reject-error" role="alert"></p><div class="dialog-footer"><span>旧版本草案保留为已替代</span><button type="submit" class="primary">退回并重新计划</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module">const goalUUID=()=>globalThis.crypto?.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});

const goalNow = () => new Date().toISOString();
const goalAgentNames = { insight:'经营分析 Agent', product:'商品运营 Agent', content:'内容营销 Agent', service:'客户服务 Agent' };
function goalEvent(g, text, card) { g.messages.push({id:goalUUID(),role:'coordinator',author:'数字员工',text,card,at:goalNow()}); }
function goalAudit(g,action,detail) { g.audit.push({id:goalUUID(),action,detail,at:goalNow(),version:g.version}); }
function requireStage(g,stages) { if(!stages.includes(g.stage))throw new Error('目标状态已变化，请刷新后重试'); }
function updateGoalTasks(g) {
 const passed = g.kind==='listing' && g.permission==='draft' ? {facts:0,plan:1,draft:2,review:3,completed:4}[g.stage] : g.kind==='listing' ? {facts:0,plan:1,draft:2,approval:3,ready:3,submitted:4,observing:5,review:5,completed:6}[g.stage] : {plan:0,draft:1,review:2,completed:3}[g.stage];
 g.tasks.forEach((t,i)=>{t.status=i<passed?'completed':i===passed?(g.paused?'paused':g.stage==='approval'?'approval':g.stage==='plan'?'confirmation':g.stage==='review'?'acceptance':g.stage==='facts'?'waiting':g.stage==='observing'?'observing':'active'):'pending';});
}
function createGoal(input={}) {
 const text=typeof input.text==='string'?input.text.trim():'';
 if(!text||text.length>2000)throw new Error('请输入 1–2000 字的目标');
 const members=[...new Set(input.members||[])];
 if(!members.length||members.some(id=>!goalAgentNames[id]))throw new Error('请至少选择一个有效 Agent');
 if(!['listing','analysis'].includes(input.kind))throw new Error('请选择目标类型');
 if(!['draft','approval'].includes(input.permission))throw new Error('请选择执行边界');
 const listing=input.kind==='listing';
 const g={id:goalUUID(),roomId:goalUUID(),sourceGoal:typeof input.sourceGoal==='string'?input.sourceGoal:null,text,kind:input.kind,members,mode:'demo',createdAt:goalNow(),version:1,stage:listing?'facts':'plan',paused:false,repliesPaused:false,
  scope:{platform:'天猫（演示）',store:'慕雅居示例店',sku:listing?'DEMO-JF-001':'店铺汇总（演示）',product:listing?'角阀 · 样例商品':'经营分析',window:7},
  criterion:listing?(input.permission==='draft'?'基于已确认规格形成上新草案，由负责人确认交付；不执行发布':'商品状态核验通过，完成 7 天经营观察；贡献利润率目标 15%（演示阈值）'):'形成有来源和限制说明的分析建议，由负责人确认交付',
  permission:listing?input.permission:'draft',owner:'你',coordinator:listing?'商品运营数字员工':'经营分析数字员工',
  facts:{confirmed:false,material:'待确认',connector:'待确认',cost:null,stock:null,source:'未确认；仅可载入虚构样例资料'},
  proposal:{title:'角阀｜材质与接口待核验',price:29.9},approval:null,execution:null,review:null,
  messages:[],queue:[],artifacts:[],audit:[],tasks:[]};
 const titles=listing&&g.permission==='draft'?['核验商品事实','确认协作计划','准备上新草案','验收草案交付']:listing?['核验商品事实','确认协作计划','准备上新草案','审批并提交发布','核验商品状态','观察与经营复盘']:['确认分析计划','准备分析交付物','验收与复盘'];
 const owners=listing?['product','product','content','product','product','insight']:['insight','insight','insight'];
 g.tasks=titles.map((title,i)=>({id:goalUUID(),goalId:g.id,title,owner:members.includes(owners[i])?owners[i]:members[0],dependsOn:i?i-1:null,status:'pending'}));
 g.messages.push({id:goalUUID(),role:'human',author:'你',text,at:goalNow()});
 goalEvent(g,listing?'目标已建立。先核验商品事实，再准备草案。发布需独立审批；当前所有资料与操作均为演示。':'目标已建立。先确认分析计划，再准备建议；此目标不会进入商品发布流程。',listing?'facts':'plan');
 updateGoalTasks(g);goalAudit(g,'created','目标、任务与协作空间同时建立');return g;
}
function goalAction(g,input={}) {
 const kind=input.kind;
 if(kind==='message'){
  const text=typeof input.text==='string'?input.text.trim():'';
  if(!text||text.length>2000)throw new Error('请输入 1–2000 字的消息');
  const target=input.target||'coordinator';
  if(target!=='coordinator'&&!g.members.includes(target))throw new Error('该 Agent 未参与此目标');
  if(g.queue.length>=24)throw new Error('待回复消息已满，请稍后发送');
  const intent=['discuss','context','change'].includes(input.intent)?input.intent:'discuss';
  const mentioned=g.members.find(id=>text.includes('@'+goalAgentNames[id].replace(' Agent','')));
  const m={id:goalUUID(),role:'human',author:'你',text,intent,at:goalNow()};g.messages.push(m);
  g.queue.push({id:goalUUID(),source:m.id,target:mentioned||target,intent});
 }else if(kind==='pauseReplies'){
  g.repliesPaused=!g.repliesPaused;
 }else if(kind==='pause'){
  if(g.stage==='completed')throw new Error('已结束的目标无需暂停');
  g.paused=!g.paused;goalEvent(g,g.paused?'目标推进已暂停。讨论仍可继续；已经提交的外部动作不能通过暂停撤回。':'目标已恢复，可从原检查点继续。');goalAudit(g,kind,g.paused?'暂停目标推进':'恢复目标推进');
 }else{
  if(g.paused)throw new Error('请先恢复目标推进');
  if(kind==='facts'){
   requireStage(g,['facts']);
   g.facts={confirmed:true,material:'黄铜（虚构样例）',connector:'G1/2（虚构样例）',cost:12,stock:200,source:'内置演示商品资料卡 / DEMO-SPEC-001',confirmedBy:'你',confirmedAt:goalNow()};
   g.proposal.title='黄铜角阀 G1/2｜样例发布草案';g.stage='plan';goalEvent(g,'已载入并确认演示资料。请确认任务顺序与交付标准。','plan');
  }else if(kind==='plan'){
   requireStage(g,['plan']);g.stage='draft';goalEvent(g,`计划 v${g.version} 已确认。专长 Agent 将按任务需要参与；不会让每位成员重复回复。`,'draft');
  }else if(kind==='draft'){
   requireStage(g,['draft']);
   const listing=g.kind==='listing';
   g.artifacts.push({id:goalUUID(),goalId:g.id,taskId:g.tasks[listing?2:1].id,version:g.version,title:listing?'商品上新草案':'经营分析建议',status:'draft',body:listing?`标题：${g.proposal.title}\n售价：¥${g.proposal.price.toFixed(2)}\nSKU：${g.scope.sku}\n材质：${g.facts.material}\n接口：${g.facts.connector}\n库存：${g.facts.stock} 件\n\n卖点文案、安装适配与售后话术需人工核验。不得将本样例规格用于真实商品。`:`目标：${g.text}\n\n1. 校验商品、订单与费用口径。\n2. 按 SKU 比较贡献利润与退款情况。\n3. 优先核查高销量低利润商品，形成调整建议。\n\n尚未连接真实数据，本内容只演示分析交付格式，没有证实任何经营结论。`,evidence:listing?g.facts.source:'内置分析模板；未读取真实经营数据'});
   g.stage=listing&&g.permission==='approval'?'approval':'review';
   if(g.stage==='approval')g.approval={id:goalUUID(),version:g.version,status:'pending',payload:JSON.stringify({scope:g.scope,proposal:g.proposal}),requestedAt:goalNow()};
   goalEvent(g,'草案已生成，可在交付物中预览。'+(g.stage==='approval'?'请检查精确发布内容后审批。':'当前权限仅准备草案，请验收交付。'),g.stage==='approval'?'approval':'review');
  }else if(kind==='revise'){
   requireStage(g,['plan','draft','approval','ready']);
   if(g.kind!=='listing')throw new Error('此目标没有发布内容');
   const price=Number(input.price), title=String(input.title||'').trim();
   if(!Number.isFinite(price)||price<=0||price>100000||!title||title.length>120)throw new Error('请输入有效标题和售价（0–100000 元，不含 0）');
   g.proposal={title,price};g.version++;if(g.approval)g.approval.status='invalidated';
   g.artifacts.forEach(a=>{if(a.status==='draft')a.status='superseded';});g.stage='plan';
   goalEvent(g,`发布内容已调整为 v${g.version}。旧审批失效，需重新确认计划与草案。`,'plan');
  }else if(kind==='approve'){
   requireStage(g,['approval']);
   if(input.version!==g.version||input.approvalId!==g.approval?.id||g.approval.status!=='pending')throw new Error('审批版本已变化，请重新检查当前动作');
   g.approval.status='approved';g.approval.approvedAt=goalNow();g.approval.approvedBy='你';g.stage='ready';goalEvent(g,`发布草案 v${g.version} 已获批准，尚未提交。`,'execute');
  }else if(kind==='reject'){
   requireStage(g,['approval']);const reason=String(input.reason||'').trim();if(!reason)throw new Error('请填写退回原因');g.approval.status='rejected';g.approval.reason=reason;g.version++;g.artifacts.forEach(a=>{if(a.status==='draft')a.status='superseded';});g.stage='plan';goalEvent(g,'审批已退回：'+reason+'。重新准备后需再次审批。','plan');
  }else if(kind==='execute'){
   if(g.stage==='submitted')return g;
   requireStage(g,['ready']);
   if(g.approval?.status!=='approved'||g.approval.version!==g.version||g.approval.payload!==JSON.stringify({scope:g.scope,proposal:g.proposal}))throw new Error('缺少有效审批，无法提交');

function tickGoal(g) {
 if(g.repliesPaused||!g.queue.length)return false;
 const job=g.queue.shift(),source=g.messages.find(m=>m.id===job.source);
 const author=job.target==='coordinator'?g.coordinator:goalAgentNames[job.target];
 let text=job.intent==='context'?'已记录这条背景资料，供后续分析参考。商品事实仍以资料卡中的已确认字段为准。':job.intent==='change'?'已记录变更请求。请通过“调整发布内容”确认具体变更；确认后会生成新版本，并使旧审批失效。':'收到。当前目标需要先完成「'+g.tasks.find(t=>t.status!=='completed')?.title+'」。可在任务与资料中查看依据和下一步。';
 if(g.stage==='completed')text='目标已结束，仍可继续讨论。需要执行新工作时，请从复盘创建下一轮目标。';
 g.messages.push({id:goalUUID(),role:job.target==='coordinator'?'coordinator':'agent',author,text:'（演示回复）'+text,replyTo:source.id,at:goalNow()});
 return true;
}

}
function publishDetails(g){return `<div class="inline-facts"><span>作用范围<strong>${esc(g.scope.store)} / ${esc(g.scope.sku)}</strong></span><span>变更前<strong>无平台商品（模拟新增）</strong></span><span>发布标题<strong>${esc(g.proposal.title)}</strong></span><span>售价 / 库存<strong>${money(g.proposal.price)} / ${g.facts.stock} 件</strong></span></div><p>成本 ${money(g.facts.cost)}，不含完整平台、履约与广告费用，不能作为贡献利润结论。</p><button class="text-button" data-tab="artifacts">先预览当前版本草案 →</button>`;}
function tasksRows(g,global=false){return g.tasks.map((t,i)=>{const visible=state.filter==='all'||state.filter==='attention'&&['waiting','approval','paused','confirmation','acceptance'].includes(t.status)||state.filter==='active'&&['active','observing'].includes(t.status)||state.filter==='completed'&&t.status==='completed';if(global&&!visible)return '';const tag=global?'button':'div';return `<${tag} class="task-row ${t.status}" ${global?`data-open="${g.id}" data-open-tab="tasks"`:''}><span class="task-number">${t.status==='completed'?'✓':String(i+1).padStart(2,'0')}</span><div class="task-text"><strong>${esc(t.title)}</strong><small>${global?esc(g.text)+' · ':''}${esc(shortName(t.owner))} · ${i?'依赖上一项完成':'首个步骤'}</small></div>${badge(taskNames[t.status],['active','approval','confirmation','acceptance'].includes(t.status))}</${tag}>`;}).join('');}
function goalTasks(g){return `<div class="tab-scroll">${actionCard(g)}<div class="section-title"><h3>执行计划</h3><small>${g.tasks.length} 项任务 · v${g.version}</small></div>${tasksRows(g)}<div class="note">确认标准：${esc(g.criterion)}</div><details class="audit-list"><summary>查看 ${g.audit.length} 条操作记录</summary>${g.audit.slice().reverse().map(a=>`<div class="audit-row"><small>${date(a.at)}</small><div><strong>${esc(a.action)} · v${a.version}</strong><p>${esc(a.detail)}</p></div></div>`).join('')}</details></div>`;}
function artifactCard(a,g){return `<article class="artifact-card"><div class="artifact-top">${icon('file')}${badge(artNames[a.status],a.status==='draft')}</div><h3>${esc(a.title)}</h3><p>${esc(g.text)}</p><small>v${a.version} · ${esc(g.scope.sku)}</small><p>${esc(a.evidence)}</p><div class="artifact-actions"><button class="text-button" data-preview="${a.id}" data-parent="${g.id}">预览完整内容 ↗</button><button class="text-button" data-download="${a.id}" data-parent="${g.id}">下载 ↓</button></div></article>`;}
function goalArtifacts(g){return `<div class="tab-scroll"><div class="section-title"><div><h3>目标交付物</h3><p>保留历史版本；审批与发布只使用当前版本。</p></div></div><div class="artifact-grid">${g.artifacts.map(a=>artifactCard(a,g)).join('')||'<div class="note">当前还没有交付物。完成资料和计划确认后，可在任务标签准备草案。</div>'}</div></div>`;}
function factsView(g){if(g.kind!=='listing')return `<div class="tab-scroll"><h3>经营资料范围</h3><table class="fact-table"><tr><th>店铺</th><td>${esc(g.scope.store)}</td></tr><tr><th>数据范围</th><td>商品、订单、平台费用与广告费用</td></tr><tr><th>接入状态</th><td>未接入。分析建议仅展示格式，不能据此作出经营决策。</td></tr></table><div class="note">生产接入后，每项分析结论需关联可追溯的数据来源和观察时间。</div><button class="secondary" data-tab="tasks">返回任务计划 →</button></div>`;
 const f=g.facts;return `<div class="tab-scroll"><div class="section-title"><h3>商品事实卡</h3>${badge(f.confirmed?'已确认样例':'待核验',true)}</div><p class="field-hint">商品规格必须来自权威资料，不能由模型猜测补全。</p><table class="fact-table"><caption>${esc(g.scope.product)} · ${esc(g.scope.sku)}</caption>${[['材质',f.material],['接口',f.connector],['采购成本',f.cost===null?'待确认':money(f.cost)],['可售库存',f.stock===null?'待确认':f.stock+' 件'],['资料来源',f.source],['确认记录',f.confirmed?f.confirmedBy+' · '+date(f.confirmedAt):'尚未确认']].map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</table><div class="note">全部为虚构样例。原型不会将聊天中的规格直接写入此卡；真实上传、ERP对接与来源冲突处理后续接入。</div>${!f.confirmed?actionButton('facts','载入并确认演示资料',false,g.paused?'disabled':''):'<button class="primary" data-tab="tasks">查看任务计划 →</button>'}${g.paused?'<p class="field-hint">目标暂停中，请从目标详情恢复后再确认。</p>':''}</div>`;}
function reviewView(g){const r=g.review;let body='';if(r){body=`<div class="section-title"><h3>经营复盘</h3>${badge('虚构样例')}</div><p class="field-hint">${esc(r.window)} · ${esc(r.source)}</p><div class="review-stats"><div><span>净销售额</span><strong>¥3,000</strong></div><div><span>贡献利润</span><strong>¥600</strong></div><div><span>贡献利润率</span><strong>20%</strong></div></div><table class="fact-table"><caption>贡献利润 = 净销售额 − 全部归属可变成本</caption>${[['净销售额',r.netSales],['商品成本',r.goods],['平台与支付费用',r.fees],['履约费用',r.fulfillment],['归因广告费用',r.ads],['售后额外损失',r.returns],['其他可变费用',r.other],['贡献利润',r.profit]].map(([k,v])=>`<tr><th>${k}</th><td>${money(v)}</td></tr>`).join('')}</table><div class="note">净销售额已扣除退款本金；售后损失只记额外成本，避免重复扣减。<br>${esc(r.result)}</div>`;}
 else if(['review','completed'].includes(g.stage))body=`<h3>交付验收</h3><p class="field-hint">本目标仅准备${g.kind==='listing'?'上新草案':'分析建议'}，没有执行真实或模拟发布。</p><div class="note">验收标准：${esc(g.criterion)}</div>${g.artifacts.filter(a=>a.version===g.version).map(a=>artifactCard(a,g)).join('')}`;
 else body=`<h3>复盘等待中</h3><p class="field-hint">${g.permission==='approval'?'先完成发布核验，再观察7天数据。动作核验通过与经营达标是两个不同结果。':'完成交付物后，在这里确认验收。'}</p><div class="note">当前没有足够资料评估结果，不将缺失数据展示为零收入。</div><button class="secondary" data-tab="tasks">查看当前任务 →</button>`;
 if(g.stage==='review')body+=`<div class="action-buttons">${actionButton('complete',r?'确认复盘并结束目标':'确认交付并结束目标',false,g.paused?'disabled':'')}<button class="text-button" data-tab="discussion">回群继续讨论</button></div>${g.paused?'<p class="field-hint">目标暂停中，请先恢复。</p>':''}`;
 if(g.stage==='completed')body+='<div class="note">负责人已验收，目标已结束。历史结果和讨论将保留。</div><button class="primary" data-followup>创建下一轮优化目标 ↗</button>';
 return `<div class="tab-scroll">${body}</div>`;}
function globalTasks(){const rows=state.goals.map(g=>tasksRows(g,true)).join('');return heading('任务中心','等待资料、人工审批与执行进度，统一跟进。')+`<div class="global-filters" role="group" aria-label="筛选任务">${[['all','全部任务'],['attention','待我处理'],['active','执行中'],['completed','已完成']].map(([v,n])=>`<button data-filter="${v}" class="${state.filter===v?'active':''}" aria-pressed="${state.filter===v}">${n}</button>`).join('')}</div><div class="panel">${rows||'<div class="empty-state"><h2>这里暂时没有任务</h2><p>创建目标后，会同步建立相关执行任务。</p></div>'}</div>`;}
function globalArtifacts(){return heading('交付物','目标内与全局视图共享成果，版本和来源始终可追溯。')+`<div class="artifact-grid">${state.goals.flatMap(g=>g.artifacts.map(a=>artifactCard(a,g))).join('')||'<div class="panel"><h2>等待第一份成果</h2><p>从目标的任务计划生成草案后，这里会同步展示。</p></div>'}</div>`;}
function employees(){return heading('数字员工','业务岗位负责目标，专业 Agent 按需提供能力。')+`<div class="role-note"><div><h3>一位目标协调者，组织一支专业团队</h3><p>上新由商品运营数字员工负责；分析由经营分析数字员工负责。每个目标拥有独立的上下文和任务记录。</p></div><span>规划 → 执行 → 检查 → 继续</span></div><div class="agent-grid">${state.agents.map(a=>`<article class="panel agent-card"><div class="artifact-top"><span class="avatar">${esc(a.initials)}</span>${badge('专业能力 · 演示')}</div><h2>${esc(a.name)}</h2><p>${esc(a.role)}</p><p class="field-hint">按需参与目标；尚未接入真实模型与外部工具。</p><button class="text-button" data-agent="${a.id}">邀请到新目标 ↗</button></article>`).join('')}</div>`;}
function connections(){return heading('连接与设置','当前可体验完整交互，真实系统能力将逐项接入。')+`<div class="note">此工作空间使用虚构资料、模板回复和模拟操作。没有真实多人账号或店铺写权限。</div><div class="connection-grid">${[['店铺与商品系统','接入商品事实、库存、订单与平台状态；先确认试点店铺和接口权限。'],['模型与专业 Agent','接入主协调模型与专业能力，按任务状态决定调用和等待。'],['知识与经营数据','接入规格说明、平台规则、费用账单与可追溯证据。'],['组织与执行权限','接入真实成员、审批人、动作白名单、预算约束和审计。']].map(([t,d])=>`<section class="panel">${badge('待接入')}<h2>${t}</h2><p>${d}</p></section>`).join('')}</div>`;}
function capture(){const form=$('#chat-form'),input=$('#chat-input'),log=$('.chat-log');if(!form)return null;const id=form.dataset.goal,s={id,focus:document.activeElement===input,start:input?.selectionStart,end:input?.selectionEnd,scroll:log?.scrollTop||0,bottom:!log||log.scrollHeight-log.scrollTop-log.clientHeight<70};positions[id]=s;return s;}
function render(force=false){const next=JSON.stringify(state);if(!force&&next===fingerprint)return;capture();fingerprint=next;$('#main').innerHTML=({overview:workspace,tasks:globalTasks,artifacts:globalArtifacts,agents:employees,connections}[state.view])();$('#page-crumb').textContent=viewNames[state.view];$('#nav-count').textContent=state.goals.flatMap(g=>g.tasks).filter(t=>['waiting','approval','confirmation','acceptance'].includes(t.status)).length;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false');});const saved=positions[state.goal]||{bottom:true},log=$('.chat-log'),input=$('#chat-input');if(log)log.scrollTop=saved.bottom?log.scrollHeight:saved.scroll;if(input&&saved.focus){input.focus({preventScroll:true});input.setSelectionRange(saved.start,saved.end);}}
function go(view){state.view=view;location.hash=view;render(true);}
function openGoal(id,tab='discussion'){capture();state.goal=id;state.tab=tab;state.details=false;sessionStorage.setItem('selectedGoal',id);go('overview');}
function receive(g){changeEpoch++;const i=state.goals.findIndex(x=>x.id===g.id);if(i<0)state.goals.unshift(g);else state.goals[i]=g;render();}
async function act(kind,extra={},id=state.goal){const result=await post(`goals/${id}/actions`,{kind,...extra});receive(result);return result;}
async function refresh(){const epoch=changeEpoch;try{const [agents,goals]=await Promise.all([api('agents'),api('goals')]);if(busy||epoch!==changeEpoch)return;state.agents=agents;state.goals=goals;$('#connection-state').textContent=storageAvailable?'本地演示':'本地保存不可用';render();}catch(err){$('#connection-state').textContent='连接中断';if(!state.agents.length)$('#main').innerHTML='<div class="panel empty-state"><h2>暂时无法连接</h2><p>请确认服务已启动，页面将自动重试。</p></div>';}}
function openCreate(text='',kind='analysis',only=null,source=null){sourceGoal=source;createStep=1;createPermission='approval';$('#goal').value=text;$('#goal-kind').value=kind;$('#form-error').textContent='';$('#agent-options').innerHTML=state.agents.map(a=>`<label class="agent-option"><input type="checkbox" name="agents" value="${a.id}" ${!only||only===a.id?'checked':''}>${esc(a.name)}</label>`).join('');showCreateStep();$('#task-dialog').showModal();$('#goal').focus();}
function showCreateStep(){const first=createStep===1;$('#create-step-one').hidden=!first;$('#create-step-two').hidden=first;$('#create-back').hidden=first;$('#create-hint').hidden=!first;$('#new-step').textContent='新建目标 · '+createStep+' / 2';$('#submit-task').textContent=first?'下一步：确认范围 →':'创建目标并进入协作 ↗';if(!first){const listing=$('#goal-kind').value==='listing';$('#scope-preview').innerHTML=`<h3>${esc($('#goal').value)}</h3>${scopeRow('负责数字员工',listing?'商品运营数字员工':'经营分析数字员工')}${scopeRow('业务范围',listing?'天猫 / 慕雅居示例店 / DEMO-JF-001':'天猫 / 慕雅居示例店 / 店铺汇总')}${scopeRow('交付标准',listing?(createPermission==='draft'?'核验规格、准备上新草案并验收；不执行发布':'核验规格、准备草案；审批发布后观察7天'):'形成分析建议，负责人确认验收')}${scopeRow('资料准备度',listing?'待核验 · 创建后补齐演示资料':'未接入 · 只演示分析结构')}`;$('#goal-permission').disabled=!listing;$('#goal-permission').value=listing?createPermission:'draft';$('#scope-note').textContent='一次性目标。以上店铺、SKU和观察窗口均为演示假设，尚未读取真实业务数据。';}}
$('#goal-permission').onchange=e=>{createPermission=e.target.value;showCreateStep();};
$('#close-dialog').onclick=()=>$('#task-dialog').close();$('#create-back').onclick=()=>{createStep=1;$('#form-error').textContent='';showCreateStep();$('#goal').focus();};
$('#task-form').onsubmit=async e=>{e.preventDefault();const members=[...document.querySelectorAll('[name=agents]:checked')].map(x=>x.value);if(!$('#goal').value.trim()||!members.length){$('#form-error').textContent='请填写目标，并至少邀请一位 Agent。';return;}if(createStep===1){createStep=2;showCreateStep();$('#new-title').tabIndex=-1;$('#new-title').focus();return;}const b=$('#submit-task');b.disabled=true;busy=true;try{const g=await post('goals',{text:$('#goal').value,members,kind:$('#goal-kind').value,permission:$('#goal-permission').value,sourceGoal});receive(g);$('#task-dialog').close();openGoal(g.id);toast('目标、协作群与任务已同时创建');}catch(err){$('#form-error').textContent=err.message;}finally{b.disabled=false;busy=false;}};
function download(a){const text=`# ${a.title}\n\n版本：v${a.version} · ${artNames[a.status]}\n\n> 演示资料，非真实业务结果\n\n${a.body}\n\n来源：${a.evidence}`;const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=a.title+'-v'+a.version+'.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#close-artifact').onclick=()=>$('#artifact-dialog').close();$('#download-preview').onclick=()=>{if(preview)download(preview);};$('#close-edit').onclick=()=>$('#edit-dialog').close();$('#close-reject').onclick=()=>$('#reject-dialog').close();
$('#edit-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;busy=true;try{await act('revise',{title:$('#publish-title').value,price:$('#publish-price').value},$('#edit-dialog').dataset.goal);$('#edit-dialog').close();state.tab='tasks';render(true);toast('已生成新版本，旧审批已失效');}catch(err){$('#edit-error').textContent=err.message;}finally{b.disabled=false;busy=false;}};
$('#reject-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;busy=true;try{await act('reject',{reason:$('#reject-reason').value},$('#reject-dialog').dataset.goal);$('#reject-dialog').close();toast('审批已退回，需重新准备');}catch(err){$('#reject-error').textContent=err.message;}finally{b.disabled=false;busy=false;}};
document.addEventListener('input',e=>{if(e.target.id==='chat-input')drafts[e.target.form.dataset.goal]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='chat-target')targets[state.goal]=e.target.value;if(e.target.id==='chat-intent')intents[state.goal]=e.target.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit();}});
document.addEventListener('submit',async e=>{if(e.target.id!=='chat-form')return;e.preventDefault();const id=e.target.dataset.goal;if(sending.has(id))return;const text=$('#chat-input').value,target=$('#chat-target').value,intent=$('#chat-intent').value;const b=e.submitter||e.target.querySelector('[type=submit]');sending.add(id);b.disabled=true;try{const g=await post(`goals/${id}/actions`,{kind:'message',text,target,intent});if(drafts[id]===text)drafts[id]='';receive(g);if(state.goal===id){$('#chat-input')?.focus();const log=$('.chat-log');if(log)log.scrollTop=log.scrollHeight;}}catch(err){if(state.goal===id&&$('#chat-error'))$('#chat-error').textContent=err.message;else toast(err.message);}finally{sending.delete(id);if(state.goal===id){const live=$('#chat-form [type=submit]');if(live){live.disabled=false;live.textContent='发送 ↗';}}}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;let ownsAction=false;try{
 if(b.hasAttribute('data-new'))openCreate();
 if(b.hasAttribute('data-sample'))openCreate('为角阀准备上新资料，确认后发布，并观察一周经营表现','listing');
 if(b.dataset.agent)openCreate('',b.dataset.agent==='product'||b.dataset.agent==='content'?'listing':'analysis',b.dataset.agent);
 if(b.dataset.view)go(b.dataset.view);
 if(b.dataset.open)openGoal(b.dataset.open,b.dataset.openTab||'discussion');
 if(b.dataset.tab){state.tab=b.dataset.tab;state.details=false;render(true);}
 if(b.dataset.filter){state.filter=b.dataset.filter;render(true);}
 if(b.hasAttribute('data-details')){state.details=!state.details;render(true);}
 if(b.dataset.mention){targets[state.goal]=b.dataset.mention;state.tab='discussion';state.details=false;render(true);$('#chat-input')?.focus();}
 if(b.dataset.action){if(busy)return;busy=true;ownsAction=true;b.disabled=true;const g=current(),extra={};if(b.dataset.action==='approve'){extra.version=g.version;extra.approvalId=g.approval.id;}if(b.dataset.mismatch)extra.mismatch=true;await act(b.dataset.action,extra);if(b.dataset.action==='facts'){state.tab='tasks';render(true);}if(b.dataset.action==='observe'||b.dataset.action==='complete'){state.tab='review';render(true);}toast('操作已记录');}
 if(b.hasAttribute('data-edit')){const g=current();$('#edit-dialog').dataset.goal=g.id;$('#publish-title').value=g.proposal.title;$('#publish-price').value=g.proposal.price;$('#edit-error').textContent='';$('#edit-dialog').showModal();}
 if(b.hasAttribute('data-reject')){$('#reject-dialog').dataset.goal=state.goal;$('#reject-reason').value='';$('#reject-error').textContent='';$('#reject-dialog').showModal();}
 if(b.dataset.preview||b.dataset.download){const g=state.goals.find(x=>x.id===b.dataset.parent),a=g.artifacts.find(x=>x.id===(b.dataset.preview||b.dataset.download));if(b.dataset.download)download(a);else{preview=a;$('#artifact-title').textContent=a.title;$('#artifact-meta').textContent=`v${a.version} · ${artNames[a.status]} · 演示资料`;$('#artifact-body').textContent=a.body;$('#artifact-evidence').textContent='来源：'+a.evidence;$('#artifact-dialog').showModal();}}
 if(b.hasAttribute('data-followup')){const g=current();openCreate('基于上一轮目标，分析商品贡献利润与退款情况，提出下一轮优化建议','analysis',null,g.id);}
 }catch(err){toast(err.message);}finally{if(ownsAction){busy=false;b.disabled=false;}}});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(viewNames[view]&&state.view!==view){state.view=view;render(true);}});
state.view=viewNames[location.hash.slice(1)]?location.hash.slice(1):'overview';
await refresh();setInterval(refresh,1800);
</script></body></html>
